# Wakes the Render free-tier server when it has spun down (self-ping only works while the process is running).
# Add repository secret RENDER_API_URL = https://your-service.onrender.com (no trailing slash)
name: Keep Render Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          if [ -z "${{ secrets.RENDER_API_URL }}" ]; then
            echo "RENDER_API_URL secret not set — skipping"
            exit 0
          fi
          curl -fsS "${{ secrets.RENDER_API_URL }}/api/health"
