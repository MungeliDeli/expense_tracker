<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <link rel="apple-touch-icon" href="/logo/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SpendWise — personal expense tracker for Zambian Kwacha" />
    <meta name="theme-color" content="#0a0f1e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpendWise" />
    <title>SpendWise</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-engine');
          var themeId = 'ocean-blue';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed.activeThemeId) themeId = parsed.activeThemeId;
          }
          document.documentElement.setAttribute('data-theme-id', themeId);
        } catch (e) {
          document.documentElement.setAttribute('data-theme-id', 'ocean-blue');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
