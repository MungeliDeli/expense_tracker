<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal expense tracker — track spending in Zambian Kwacha" />
    <title>Expense Tracker</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme-engine');
          var themeId = 'ocean-blue';
          if (stored) {
            var parsed = JSON.parse(stored);
            if (parsed.activeThemeId) themeId = parsed.activeThemeId;
          }
          document.documentElement.setAttribute('data-theme-id', themeId);
        } catch (e) {
          document.documentElement.setAttribute('data-theme-id', 'ocean-blue');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
